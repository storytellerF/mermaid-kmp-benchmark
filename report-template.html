<!DOCTYPE html>
<!-- Layout and styling adapted from storytellerF/mermaid-rust-benchmark. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mermaid KMP Libraries Benchmark Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    color-scheme: light dark;
    --page: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --badge: #e2e8f0;
    --text: #1e293b;
    --muted: #475569;
    --border: #cbd5e1;
    --link: #4338ca;
    --link-hover: #6d28d9;
    --success: #047857;
    --success-bg: #ecfdf5;
    --error: #991b1b;
    --error-bg: #fef2f2;
    --header-start: #4338ca;
    --header-end: #6b21a8;
    --tooltip-bg: #1e293b;
    --tooltip-text: #f8fafc;
}
@media (prefers-color-scheme: dark) {
    :root {
        --page: #0f172a;
        --surface: #1e293b;
        --surface-alt: #273449;
        --badge: #334155;
        --text: #f1f5f9;
        --muted: #cbd5e1;
        --border: #64748b;
        --link: #a5b4fc;
        --link-hover: #c4b5fd;
        --success: #6ee7b7;
        --success-bg: #064e3b;
        --error: #fecaca;
        --error-bg: #450a0a;
        --header-start: #312e81;
        --header-end: #581c87;
        --tooltip-bg: #f1f5f9;
        --tooltip-text: #1e293b;
    }
}
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--page);
    min-height: 100vh; color: var(--text); line-height: 1.6;
}
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
header {
    text-align: center; margin-bottom: 3rem;
    background: linear-gradient(135deg, var(--header-start) 0%, var(--header-end) 100%);
    padding: 3rem 2rem; border-radius: 20px; color: white;
    box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
}
header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; }
header p { font-size: 1.1rem; margin-top: 0.5rem; }
.meta { display: flex; gap: 2rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
.meta-item {
    background: rgba(0,0,0,0.15); padding: 0.5rem 1.2rem;
    border-radius: 30px; font-size: 0.9rem; backdrop-filter: blur(10px);
}
.section { margin-bottom: 3rem; }
.section h2 {
    font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem;
    color: var(--text); display: flex; align-items: center; gap: 0.5rem;
}
.section h2::before {
    content: ''; display: inline-block; width: 4px; height: 28px;
    background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 2px;
}
.table-wrap {
    overflow-x: auto; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
thead th {
    background: var(--surface-alt); padding: 1rem; text-align: left; font-weight: 600;
    color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; z-index: 1;
}
tbody td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
tbody tr:hover { background: var(--surface-alt); }
tbody tr:last-child td { border-bottom: none; }
.lib-name {
    font-weight: 600; white-space: nowrap;
}
.lib-name a {
    color: var(--link); text-decoration: none;
    transition: color 0.2s;
}
.lib-name a:hover { color: var(--link-hover); text-decoration: underline; }
.version {
    display: inline-block; font-size: 0.75rem; font-weight: 500;
    color: var(--muted); background: var(--badge); padding: 0.1rem 0.5rem;
    border-radius: 10px; margin-left: 0.5rem;
}
.lib-type {
    font-size: 0.8rem; font-weight: 500; text-align: center;
}
.lib-desc { color: var(--muted); font-size: 0.85rem; max-width: 320px; }
.bench-cell {
    font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500;
}
.bench-cell .ci {
    display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400;
}
.bench-cell.na { color: var(--muted); font-style: italic; font-weight: 400; }
.bench-cell.fastest {
    color: var(--success); background: var(--success-bg);
}
.bench-header { text-align: center; }
.charts-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
    gap: 1.5rem;
}
.chart-card {
    background: var(--surface); border-radius: 16px; padding: 1.5rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    height: 340px; min-width: 0;
}
footer {
    text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem;
}
a { color: var(--link); }
a:hover { color: var(--link-hover); }
a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
footer a { text-decoration: underline; }
.diagnostics {
    color: var(--error); background: var(--error-bg); overflow-wrap: anywhere;
    padding: 1.5rem; border: 1px solid var(--error); border-radius: 16px;
}
.diagnostics h2 { color: inherit; }
@media (max-width: 768px) {
    .container { padding: 1rem; }
    header { padding: 2rem 1rem; }
    header h1 { font-size: 1.6rem; }
    .charts-grid { grid-template-columns: 1fr; }
    .chart-card { height: 280px; }
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Mermaid KMP Libraries Benchmark</h1>
<p>Performance comparison of Kotlin Multiplatform Mermaid diagram implementations</p>
<div class="meta">__META__</div>
</header>
__SECTIONS__
__DIAGNOSTICS__
<footer>Benchmarks powered by <a href="https://github.com/openjdk/jmh">JMH</a>. Lower is better.<br>Average time with 99.9% confidence intervals. Stages are measured separately.</footer>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const charts = [];
    const preference = window.matchMedia('(prefers-color-scheme: dark)');

    // Canvas colors do not inherit CSS. Read the same palette on every refresh,
    // including pages restored from the back/forward cache.
    function applyChartTheme(chart) {
        const style = getComputedStyle(document.documentElement);
        const color = name => style.getPropertyValue(name).trim();
        chart.options.color = color('--muted');
        chart.options.plugins.title.color = color('--text');
        Object.values(chart.options.scales).forEach(scale => {
            scale.ticks.color = color('--muted');
            scale.title.color = color('--muted');
            scale.grid.color = color('--border');
            scale.border.color = color('--border');
        });
        Object.assign(chart.options.plugins.tooltip, {
            backgroundColor: color('--tooltip-bg'),
            titleColor: color('--tooltip-text'),
            bodyColor: color('--tooltip-text'),
            borderColor: color('--border'),
            borderWidth: 1
        });
        chart.update('none');
    }

    function createReportChart(canvas, config) {
        const chart = new Chart(canvas, config);
        charts.push(chart);
        applyChartTheme(chart);
    }

    function refreshCharts() {
        charts.forEach(applyChartTheme);
    }

    if (typeof Chart !== 'undefined') {
__CHARTS__
    }
    preference.addEventListener('change', refreshCharts);
    window.addEventListener('pageshow', refreshCharts);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refreshCharts();
    });
});
</script>
</body>
</html>
