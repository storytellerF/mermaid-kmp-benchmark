name: Benchmark & Deploy Report

on:
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - 'cmp/**'
      - 'native/**'
      - 'lugf/**'
      - 'diagram/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'run_benchmarks.py'
      - 'prepare.py'
      - 'generate_report.py'
      - 'report-template.html'
      - 'libraries.lock.json'
      - 'discovery*.json'
      - 'test-data/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
      - run: python -m unittest discover -s tests

      - name: Run benchmarks
        run: python run_benchmarks.py

      - name: Verify SVG validation
        run: ./gradlew :bench:test --console=plain

      - name: Prepare pages directory
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp -r results _site/results
          cp libraries.lock.json discovery.json _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: benchmark
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
